<style>

body{background:#f6f6f3;color:#111;overflow-x:hidden}
header{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ffe600}
#map{height:44vh;z-index:1;border-bottom:3px solid #111}
.top{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #eee}

.form-group label{display:block;font-size:13px;font-weight:800;color:#111;margin-bottom:5px}
.form-group input,.form-group textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #ddd;background:#fafafa;font-size:14px}

<header><h1 id="tituloCiudad">🐾 BuscaPatas</h1><span id="ubiTxt">Cargando...</span></header>
<div class="hero-wsp"><div style="font-size:13px;font-weight:800">¿PERDISTE UN PERRO EN TRES ARROYOS? <span style="color:#ffe600">MANDALO A SANTI</span></div><a class="btn-wsp-hero" href="https://wa.me/5492983389710" target="_blank">💬 WHATSAPP 2983 389710</a></div>
<div id="map"></div>
<div class="top"><span id="filtroTxt">Tocá foto → ver grande</span><span id="contadorTxt" style="background:#111;color:#ffe600;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:900">0 perdidos</span></div>
<div class="ia-barra"><button class="btn-ia-todo" onclick="buscarTodoConIA()">🔍 BUSCAR IA</button><button class="btn-ia-foto" onclick="abrirSoloFoto()">📸 SOLO FOTO</button></div>
<div class="dona"><div class="aliasBtn" onclick="copiarAlias()">BUSCAPATASDONACION</div></div>

<div id="modalMapa" class="modal-bg"><div class="modal-box" style="text-align:center"><h2>📍 ¿Qué pasó acá?</h2><p id="coordTxt"></p><div class="opcionesMap"><button class="btn-perdido" onclick="desdeMapa('PERDIDO')">😢 PERDÍ acá</button><button class="btn-encontrado" onclick="desdeMapa('ENCONTRADO')">🙏 ENCONTRÉ acá</button><button class="btn-abandonado" onclick="desdeMapa('ABANDONADO')">💔 ABANDONADO acá</button><button class="btn-cancel" style="padding:12px;border-radius:12px;border:none" onclick="closeModal('modalMapa')">Cancelar</button></div></div></div>

<div id="formModal" class="modal-bg"><div class="modal-box"><h2 id="formTitle">Título</h2><div class="form-group"><label>Nombre *</label><input id="fNombre" type="text" placeholder="Ej: Milo"><div id="errNombre" class="form-error">Poné un nombre</div></div><div class="form-group"><label>Descripción</label><textarea id="fDesc" rows="3"></textarea></div><div class="form-group"><label>WhatsApp *</label><input id="fContacto" type="tel" placeholder="2983..."><div id="errContacto" class="form-error">Poné tu WhatsApp</div></div><div class="form-group"><label>Fotos (hasta 5) *</label><input id="fFoto" type="file" accept="image/*" multiple onchange="previewFoto(event)"><div class="fotoWrap" id="fotoWrap"></div><small style="font-size:10px;color:#888">Tocá para elegir varias fotos del mismo perro</small></div><div class="form-group"><label>Ubicación</label><div class="ubicacion-box"><span id="fLatLngTexto">Cargando...</span></div><input id="fLatLng" type="hidden"></div><div class="btns"><button class="btn-cancel" onclick="closeModal('formModal')">Cancelar</button><button class="btn-send" id="btnSend" onclick="guardar()">SUBIR AL MAPA</button></div></div></div>

<div id="soloFotoModal" class="modal-bg"><div class="modal-box" style="text-align:center"><h2>📸 Solo foto</h2><input id="fSoloFoto" type="file" accept="image/*" onchange="buscarSoloConFoto(event)"><div class="fotoWrap" id="fotoWrap2" style="display:none;margin-top:10px"><img id="fotoPrev2"></div><button class="btn-cancel" style="width:100%;margin-top:12px;padding:12px;border-radius:999px;border:none" onclick="closeModal('soloFotoModal')">Cerrar</button></div></div>

<div id="modalMatch" class="modal-bg"><div class="modal-box"><h2 id="matchTitle"></h2><p id="matchSub"></p><div id="matchLista"></div><button onclick="closeModal('modalMatch')" style="margin-top:12px;width:100%;padding:12px;border-radius:999px;border:none;background:#111;color:#fff">Cerrar</button></div></div>

<div id="modalFotoGrande" class="modal-bg"><div class="modal-box" style="padding:0;overflow:hidden;max-width:480px"><div class="fotoGrande-top"><img id="fotoGrandeImg" src=""><button class="fotoGrande-close" onclick="cerrarModoFoto()">✕</button><button id="prevFoto" class="fotoGrande-nav" onclick="cambiarFoto(-1)">‹</button><button id="nextFoto" class="fotoGrande-nav" onclick="cambiarFoto(1)">›</button></div><div class="fotoGrande-datos"><h3 id="fotoGrandeNombre"></h3><div id="fotoGrandeContador"></div><div id="fotoGrandeDesc" style="font-size:12px;color:#444;margin-top:6px"></div><a id="fotoGrandeTel" href="#" target="_blank" style="display:block;margin-top:10px;background:#25D366;color:#fff;padding:11px;border-radius:999px;text-decoration:none;font-weight:800;text-align:center">WhatsApp</a><button style="margin-top:10px;width:100%;padding:11px;border-radius:999px;border:none;background:#111;color:#fff" onclick="cerrarModoFoto()">Cerrar</button></div></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwkSukpwgNRgEvkDwbCB-k3KBsRevo7KMZDxaV9KeXrTyvHBq1tad5Sou5iKRB4AHGNRg/exec';
const CIUDAD_FILTRO=new URLSearchParams(location.search).get('ciudad')||'Tres Arroyos';
document.getElementById('tituloCiudad').innerText='🐾 BuscaPatas '+CIUDAD_FILTRO;
const map=L.map('map').setView([-38.375,-60.275],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let KEY='buscapatas';
let mascotas=[];try{mascotas=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){mascotas=[]}
let currentTipo='PERDIDO',tempLatLng=null,tempFotos=[],userPos=null,filtro='TODOS',tempHash=null;
let markers=[];
let galeriaActual=[],indiceActual=0;

function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}
function abrirSoloFoto(){openModal('soloFotoModal')}
function copiarAlias(){navigator.clipboard.writeText('BUSCAPATASDONACION');alert('Copiado: BUSCAPATASDONACION')}

async function cargarDeSheet(){
 try{
  const r=await fetch(API_URL);
  const d=await r.json();
  let delSheet=d.map(row=>{
   let fotosArr=[];
   if(row.fotos && Array.isArray(row.fotos) && row.fotos.length>0) fotosArr=row.fotos;
   else if(row.foto) fotosArr=[row.foto];
   return {id:row.id,tipo:row.tipo,nombre:row.nombre,desc:row.desc,contacto:row.contacto,lat:parseFloat(row.lat),lng:parseFloat(row.lng),foto:row.foto,fotos:fotosArr,iaHash:row.iaHash||{hash:[]},fecha:row.fecha,ciudad:row.ciudad||'Tres Arroyos',encontrado:row.encontrado||false}
  }).filter(p=>p.lat);
  mascotas=delSheet;
  localStorage.setItem(KEY,JSON.stringify(mascotas));
  render();
  document.getElementById('ubiTxt').innerText='✅ '+delSheet.length+' del Sheet';
 }catch(e){
  render();
  document.getElementById('ubiTxt').innerText='📦 Local ('+mascotas.length+')';
 }
}
cargarDeSheet();

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    userPos={lat:p.coords.latitude,lng:p.coords.longitude};
    document.getElementById('ubiTxt').innerText='📍 Ubicación lista';
    map.setView(userPos,14);
  });
}

map.on('click',e=>{
  tempLatLng={lat:e.latlng.lat,lng:e.latlng.lng};
  let txt=tempLatLng.lat.toFixed(5)+','+tempLatLng.lng.toFixed(5);
  document.getElementById('fLatLng').value=txt;
  document.getElementById('fLatLngTexto').innerText=txt;
  document.getElementById('coordTxt').innerText='📍 '+txt;
  openModal('modalMapa');
});

function desdeMapa(t){closeModal('modalMapa');abrirForm(t);}

function abrirForm(t){
 currentTipo=t;
 if(!tempLatLng){
   if(userPos) tempLatLng=userPos;
   else{let c=map.getCenter();tempLatLng={lat:c.lat,lng:c.lng};}
 }
 document.getElementById('formTitle').innerText='SUBIR COMO '+t;
 let txt=tempLatLng.lat.toFixed(5)+','+tempLatLng.lng.toFixed(5);
 document.getElementById('fLatLng').value=txt;
 document.getElementById('fLatLngTexto').innerText=txt;
 document.getElementById('btnSend').innerText='SUBIR COMO '+t;
 document.getElementById('errNombre').style.display='none';
 document.getElementById('errContacto').style.display='none';
 tempFotos=[];
 document.getElementById('fotoWrap').innerHTML='';
 document.getElementById('fotoWrap').style.display='none';
 openModal('formModal');
}

function previewFoto(ev){
 const files=Array.from(ev.target.files).slice(0,5);
 tempFotos=[];
 const wrap=document.getElementById('fotoWrap');
 wrap.innerHTML='';
 wrap.style.display='flex';
 let loaded=0;
 files.forEach(file=>{
   const reader=new FileReader();
   reader.onload=e=>{
     tempFotos.push(e.target.result);
     let img=document.createElement('img');
     img.src=e.target.result;
     wrap.appendChild(img);
     loaded++;
     if(loaded==1) calcularHashIA(e.target.result,h=>tempHash=h);
   };
   reader.readAsDataURL(file);
 });
}

function calcularHashIA(dataUrl,cb){
 const img=new Image();
 img.onload=()=>{
  const c=document.createElement('canvas');c.width=16;c.height=16;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0,16,16);
  const d=ctx.getImageData(0,0,16,16).data;
  let grays=[];let sum=0;
  for(let i=0;i<d.length;i+=4){let g=(d[i]+d[i+1]+d[i+2])/3;grays.push(g);sum+=g;}
  let avg=sum/grays.length;
  let bits=grays.map(v=>v>avg?1:0);
  cb({hash:bits,gray:grays,avg:avg});
 };
 img.src=dataUrl;
}

function compararIA(h1,h2){
 if(!h1||!h2||!h1.hash||h1.hash.length<10)return 0;
 function aBits(h){if(Math.max(...h.hash)<=1)return h.hash;let arr=h.gray&&h.gray.length?h.gray:h.hash;let avg=h.avg||arr.reduce((a,b)=>a+b,0)/arr.length;return arr.map(v=>v>avg?1:0);}
 let b1=aBits(h1),b2=aBits(h2),len=Math.min(b1.length,b2.length),diff=0;
 for(let i=0;i<len;i++)if(b1[i]!==b2[i])diff++;
 if(diff===0)return 99;if(diff<=3)return 96;if(diff<=10)return 88;if(diff>80)return 5;
 return Math.round(Math.max(5,100-(diff/len*100)));
}
function distancia(a,b){const R=6371;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function scoreTotal(p,e){let sFoto=compararIA(p.iaHash,e.iaHash);if(sFoto<55)return{score:sFoto};let score=sFoto;let km=distancia(p,e);if(km<5)score+=10;return{score:Math.min(Math.round(score),99),km}}

// CORREGIDO - No se cuelga nunca
function comprimirFoto(dataUrl, maxW=800, calidad=0.7){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.width, h=img.height;
        if(w>maxW){ h=h*maxW/w; w=maxW; }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',calidad));
      }catch(e){ res(dataUrl); }
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

// CORREGIDO - Avisa con alert si falta algo y no se cuelga
async function guardar(){
  try{
    const btn=document.getElementById('btnSend');
    btn.disabled=true;
    btn.innerText='SUBIENDO...';

    let nombre=document.getElementById('fNombre').value.trim();
    let desc=document.getElementById('fDesc').value.trim();
    let contacto=document.getElementById('fContacto').value.trim();

    if(!nombre){ alert('Poné un nombre'); btn.disabled=false; btn.innerText='SUBIR AL MAPA'; return; }
    if(!contacto){ alert('Poné tu WhatsApp'); btn.disabled=false; btn.innerText='SUBIR AL MAPA'; return; }
    if(tempFotos.length==0){ alert('Subí al menos 1 foto y esperá a que aparezca la miniatura'); btn.disabled=false; btn.innerText='SUBIR AL MAPA'; return; }
    if(!tempLatLng){ if(userPos) tempLatLng=userPos; else { let c=map.getCenter(); tempLatLng={lat:c.lat,lng:c.lng}; } }

    let fotosComprimidas=[];
    for(let f of tempFotos){
      fotosComprimidas.push(await comprimirFoto(f));
    }

    let nueva={id:Date.now(),tipo:currentTipo,nombre:nombre,desc:desc,contacto:contacto,lat:tempLatLng.lat,lng:tempLatLng.lng,foto:fotosComprimidas[0],fotos:fotosComprimidas,iaHash:tempHash||{hash:[]},fecha:Date.now(),ciudad:CIUDAD_FILTRO,encontrado:false};

    mascotas.push(nueva);
    localStorage.setItem(KEY,JSON.stringify(mascotas));
    filtro='TODOS';
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('act'));
    document.getElementById('tab-TODOS').classList.add('act');
    render();
    closeModal('formModal');
    document.getElementById('fNombre').value='';document.getElementById('fDesc').value='';document.getElementById('fContacto').value='';document.getElementById('fFoto').value='';document.getElementById('fotoWrap').style.display='none';
    tempFotos=[];tempHash=null;
    alert('✅ SUBIDO COMO '+currentTipo+' con '+nueva.fotos.length+' fotos');

    try{
      await fetch(API_URL,{
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'add', data:nueva})
      });
    }catch(e){ console.log('Error al subir al Sheet', e); }

    btn.disabled=false;
    btn.innerText='SUBIR AL MAPA';
  }catch(err){
    alert('Error: '+err.message);
    let btn=document.getElementById('btnSend');
    if(btn){ btn.disabled=false; btn.innerText='SUBIR AL MAPA'; }
  }
}

function render(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
 document.getElementById('lista').innerHTML='';
 let filtradas=mascotas.filter(m=>{if(filtro!='TODOS'&&m.tipo!=filtro) return false; return true;});
 document.getElementById('contadorTxt').innerText=filtradas.length+' en '+filtro;
 filtradas.forEach(m=>{
  let fotosArr=m.fotos && m.fotos.length?m.fotos:(m.foto?[m.foto]:[]);
  let foto=fotosArr[0]||'https://placehold.co/100?text=🐾';
  let bg=m.tipo=='PERDIDO'?'#111':m.tipo=='ENCONTRADO'?'#ffe600':'#ff6b35';
  let col=m.tipo=='PERDIDO'?'#fff':m.tipo=='ENCONTRADO'?'#111':'#fff';
  let iconHtml=`<div style="position:relative"><img src="${foto}" class="custom-pin" style="border-color:${bg}"><div class="pin-label" style="background:${bg};color:${col}">${m.tipo}${fotosArr.length>1?' +'+fotosArr.length:''}</div></div>`;
  let icon=L.divIcon({html:iconHtml,className:'',iconSize:[54,54],iconAnchor:[27,48]});
  let telLimpio=String(m.contacto||'').replace(/\D/g,'');
  let mk=L.marker([m.lat,m.lng],{icon}).addTo(map);
  mk.bindPopup(`<b>${m.nombre}</b><br>${m.tipo}<br><a href="https://wa.me/549${telLimpio}" target="_blank">📱 ${m.contacto}</a>`);
  markers.push(mk);
 });
 filtradas.slice().reverse().forEach(m=>{
  let fotosArr=m.fotos && m.fotos.length?m.fotos:(m.foto?[m.foto]:[]);
  let foto=fotosArr[0]||'https://placehold.co/100?text=🐾';
  let telLimpio=String(m.contacto||'').replace(/\D/g,'');
  let div=document.createElement('div');
  div.className='card';
  div.innerHTML=`<img src="${foto}" onclick="verFotoGrande('${m.id}')"><div style="flex:1"><span class="badge" style="background:#111;color:#fff">${m.tipo}</span> ${fotosArr.length>1?`<span class="badge-fotos">📸 ${fotosArr.length}</span>`:''} <b>${m.nombre}</b><br><small>${m.desc||''}</small><br><small>📱 ${m.contacto}</small><br><a href="https://wa.me/549${telLimpio}" target="_blank" style="font-size:11px;font-weight:800">WhatsApp</a></div>`;
  document.getElementById('lista').appendChild(div);
 });
 if(filtradas.length==0){
   document.getElementById('lista').innerHTML='<p style="text-align:center;color:#999;margin-top:20px">No hay datos en '+filtro+'</p>';
 }
}

function setFiltro(f){
  filtro=f;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('act'));
  document.getElementById('tab-'+f).classList.add('act');
  render();
}

window.verFotoGrande=function(id){
  let m=mascotas.find(x=>String(x.id)==String(id));
  if(!m) return;
  let fotosArr=m.fotos && m.fotos.length?m.fotos:(m.foto?[m.foto]:[]);
  galeriaActual=fotosArr;
  indiceActual=0;
  mostrarFotoActual(m);
  openModal('modalFotoGrande');
}
function mostrarFotoActual(m){
  if(galeriaActual.length==0) return;
  document.getElementById('fotoGrandeImg').src=galeriaActual[indiceActual];
  document.getElementById('fotoGrandeNombre').innerText=m.nombre;
  document.getElementById('fotoGrandeDesc').innerText=m.desc||'';
  document.getElementById('fotoGrandeContador').innerText=(indiceActual+1)+'/'+galeriaActual.length;
  let telLimpio=String(m.contacto||'').replace(/\D/g,'');
  document.getElementById('fotoGrandeTel').href='https://wa.me/549'+telLimpio;
  document.getElementById('fotoGrandeTel').innerText='📱 '+m.contacto;
  document.getElementById('prevFoto').style.display=galeriaActual.length>1?'block':'none';
  document.getElementById('nextFoto').style.display=galeriaActual.length>1?'block':'none';
}
window.cambiarFoto=function(dir){
  let mId=mascotas.find(x=>galeriaActual.includes(document.getElementById('fotoGrandeImg').src))?.id || mascotas.find(x=>x.nombre==document.getElementById('fotoGrandeNombre').innerText)?.id;
  let m=mascotas.find(x=>String(x.id)==String(mId)) || mascotas.find(x=>x.nombre==document.getElementById('fotoGrandeNombre').innerText);
  indiceActual=(indiceActual+dir+galeriaActual.length)%galeriaActual.length;
  if(m) mostrarFotoActual(m);
  else {
    document.getElementById('fotoGrandeImg').src=galeriaActual[indiceActual];
    document.getElementById('fotoGrandeContador').innerText=(indiceActual+1)+'/'+galeriaActual.length;
  }
}
window.cerrarModoFoto=function(){closeModal('modalFotoGrande');}

function buscarSoloConFoto(ev){
 const file=ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=e=>{
  const dataUrl=e.target.result;
  document.getElementById('fotoPrev2').src=dataUrl;
  document.getElementById('fotoWrap2').style.display='block';
  calcularHashIA(dataUrl,h=>{
   let temp={iaHash:h};
   let res=mascotas.map(m=>{let r=scoreTotal(temp,m);return{...r,m}}).filter(x=>x.score>=55).sort((a,b)=>b.score-a.score);
   closeModal('soloFotoModal');
   document.getElementById('matchTitle').innerText=res.length+' parecidos';
   document.getElementById('matchLista').innerHTML=res.map(x=>`<div class="card"><img src="${x.m.fotos?x.m.fotos[0]:x.m.foto}" onclick="verFotoGrande('${x.m.id}')"><b>${x.m.nombre} ${x.score}%</b></div>`).join('')||'Sin parecidos';
   openModal('modalMatch');
  });
 };
 r.readAsDataURL(file);
}

function buscarTodoConIA(){
 if(mascotas.length<2){alert('Subí 2 fotos');return}
 let todos=[];mascotas.forEach(a=>{mascotas.forEach(b=>{if(a.id<b.id){let r=scoreTotal(a,b);if(r.score>=55)todos.push({...r,a,b})}})});todos.sort((x,y)=>y.score-x.score);
 document.getElementById('matchTitle').innerText=todos.length+' coincidencias';
 document.getElementById('matchLista').innerHTML=todos.map(r=>`<div class="card"><b>${r.a.nombre} ↔ ${r.b.nombre} ${r.score}%</b></div>`).join('')||'Sin coincidencias';
 openModal('modalMatch');
}

window.copiarAlias=copiarAlias;
window.buscarTodoConIA=buscarTodoConIA;
window.abrirSoloFoto=abrirSoloFoto;
window.buscarSoloConFoto=buscarSoloConFoto;
window.closeModal=closeModal;
